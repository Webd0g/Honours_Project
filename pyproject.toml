[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rubin_eex_finder"
version = "0.1.0"
description = "Rubin early excess finder pipeline"
authors = [{name = "Riley Webster"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "numpy",
    "matplotlib",
    "astropy",
    "sncosmo",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]